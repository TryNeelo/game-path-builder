<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build the Path</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800&display=swap">
<style>
/* Layout: one-screen game. Board (one 6×4 section plus a peek margin) beside a piece tray; coins on top, the progress row along the bottom edge. */
:root {
  color-scheme: light;
  --sky: #CDEEF7;
  --water: #A9DCEB;
  --grass-a: #C4E7A8;
  --forest: #8CC66F;
  --pond: #74C9EA;
  --grass-edge: #79B65C;
  --road: #F8E6BB;
  --road-edge: #D79A55;
  --road-dash: #FFF8E4;
  --ink: #2A2148;
  --panel: #FFF8EC;
  --panel-edge: #EBCB97;
  --pink: #FF60CF;
  --gold: #FFC200;
  --white: #FFFFFF;
  --cloud: #E6F1F7;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --ui: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  --c: 140px;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sky);
  color: var(--ink);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  font-family: var(--ui);
}
img { -webkit-user-drag: none; pointer-events: none; }
#app {
  position: fixed; inset: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px));
  background:
    radial-gradient(ellipse 30% 14% at 12% 92%, #FFFFFF99 0 60%, transparent 61%),
    radial-gradient(ellipse 22% 10% at 88% 8%, #FFFFFF88 0 60%, transparent 61%),
    var(--sky);
}
#stage { position: relative; width: 100%; height: 100%; }

/* ---------- top bar ---------- */
#coins {
  position: absolute; left: 0; top: 18px; height: 56px;
  display: flex; align-items: center; gap: 8px; padding: 0 18px 0 8px;
  background: var(--panel); border: 3px solid var(--white); border-radius: 30px;
  box-shadow: 0 4px 0 #0000001a;
  font-family: var(--display); font-size: 30px; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
#coins img { width: 40px; height: 40px; }
#coins.pop { animation: pop .45s cubic-bezier(.3,1.8,.5,1); }
/* The progress row: one friend per lesson. Done ones in full colour, the next one pulsing, the rest faint.
   It sits centred on the board's bottom edge (placed in layout()). */
#stars {
  position: absolute; z-index: 6; transform: translate(-50%, -50%); height: calc(var(--c) * .4);
  display: flex; align-items: center; gap: calc(var(--c) * .06); padding: 0 calc(var(--c) * .16);
  background: var(--panel); border: 3px solid var(--white); border-radius: 999px;
  box-shadow: 0 4px 0 #0000001a; pointer-events: none;
}
#music {
  position: absolute; right: 0; top: 14px; width: 60px; height: 60px;
  border-radius: 50%; border: 3px solid var(--white); background: var(--panel);
  box-shadow: 0 4px 0 #0000001a; display: grid; place-items: center; cursor: pointer; padding: 0;
}
#music svg { width: 30px; height: 30px; pointer-events: none; }
#music .slash { display: none; }
#music.off .slash { display: inline; }
#music:focus-visible, .btn:focus-visible { outline: 4px solid var(--pink); outline-offset: 3px; }
#stars .li { width: calc(var(--c) * .3); height: calc(var(--c) * .3); display: grid; place-items: center; border-radius: 50%; background: #CFE7F3;
  filter: grayscale(1); opacity: .5; transition: filter .3s, opacity .3s; }
#stars .li img, #stars .li svg { width: 100%; height: 100%; display: block; filter: none; opacity: 1; }
#stars .li.done { filter: none; opacity: 1; }
#stars .li.now { filter: none; opacity: 1; animation: ready 1.4s ease-in-out infinite; }
#stars .li.pop { animation: pop .45s cubic-bezier(.3,1.8,.5,1); }
#stars:has(.li) { height: calc(var(--c) * .46); }

/* ---------- board ---------- */
#board {
  position: absolute; overflow: hidden;
  background:
    radial-gradient(circle at 25% 30%, #FFFFFF33 0 2px, transparent 3px) 0 0 / 34px 34px,
    var(--water);
  border: 5px solid var(--white);
  border-radius: calc(var(--c) * .22);
  box-shadow: 0 8px 0 #2A214822, 0 18px 40px #2A214826;
}
#world { position: absolute; left: 0; top: 0; width: 0; height: 0; }
#world.panning { transition: transform 1.15s cubic-bezier(.65,0,.3,1); }
.at {
  position: absolute; left: 0; top: 0;
  width: var(--c); height: var(--c);
  transform: translate(calc(var(--x) * var(--c)), calc(var(--y) * var(--c)));
  display: grid; place-items: center;
}
.plate {
  position: absolute; left: 0; top: 0;
  transform: translate(calc(var(--x) * var(--c) - 6px), calc(var(--y) * var(--c) - 6px));
  width: calc(var(--w) * var(--c) + 12px); height: calc(var(--h) * var(--c) + 12px);
  background: var(--grass-edge); border-radius: calc(var(--c) * .2);
  box-shadow: 0 6px 0 #4E8B3A55;
}
.cell::before {
  content: ""; position: absolute; inset: 3px; border-radius: 18%;
  background: var(--grass-a); box-shadow: inset 0 -5px 0 #00000010;
}
.cell.block::before { background: var(--forest); box-shadow: inset 0 -5px 0 #00000014; }
.cell.water::before { inset: 1px; border-radius: 16%; background: var(--pond); box-shadow: inset 0 5px 0 #0000001a; }
.deco { z-index: 2; pointer-events: auto; }
.deco svg { width: calc(var(--c) * .92); height: calc(var(--c) * .92); transform-origin: 50% 85%; }
.deco.wobble svg { animation: wobble .4s ease-in-out; }
.cell.hi::after {
  content: ""; position: absolute; inset: 6px; border-radius: 18%;
  border: 4px dashed var(--white); background: #FFFFFF40;
}
.glow::after {
  content: ""; position: absolute; inset: 5px; border-radius: 18%;
  border: 5px dashed var(--pink); animation: gap .7s ease-in-out 4 alternate;
}
.tile { z-index: 2; cursor: pointer; }
.tile .rot, .float .rot, .slot .rot { width: 100%; height: 100%; transform: rotate(var(--rot, 0deg)); transition: transform .3s cubic-bezier(.3,1.7,.5,1); }
.tile.dropped .rot { animation: drop .32s cubic-bezier(.3,1.8,.5,1); }
.tile.lifting { opacity: .25; }
.road { width: 100%; height: 100%; display: block; overflow: visible; }
.road .re { stroke: var(--road-edge); }
.road .rf { stroke: var(--road); }
.road .rd { stroke: var(--road-dash); }
.item { z-index: 3; pointer-events: none; }
.target { pointer-events: auto; cursor: pointer; }
.item img, .item svg { display: block; }
.coin img { width: calc(var(--c) * .5); height: calc(var(--c) * .5); }
.coin { width: calc(var(--c) * .58); height: calc(var(--c) * .58); display: grid; place-items: center; border-radius: 50%; }
.coin img { animation: shine 2.4s ease-in-out infinite; }
.pickup .pk { width: calc(var(--c) * .62); height: calc(var(--c) * .62); margin-top: -12%; transform-origin: 50% 100%;
  filter: drop-shadow(0 0 8px #FF60CF99); animation: boingidle 3.2s ease-in-out infinite; }
.pickup svg, .flyspring svg { width: 100%; height: 100%; display: block; }
.flyspring { position: absolute; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px; }
.bat .bb { position: relative; width: calc(var(--c) * .8); height: calc(var(--c) * .8); transition: scale .25s, translate .25s; }
.bat .bb img { width: 100%; height: 100%; }
/* A pouch bat's pouch: a coin peeks out of the top, a slow golden glow swells and fades, and now and then a glint flashes on it. */
.bat .pouch { position: absolute; right: -18%; bottom: -8%; width: 62%; isolation: isolate; }
.bat .pouch::before { content: ""; position: absolute; inset: -30% -30% -24% -24%; z-index: -1; border-radius: 50%;
  background: radial-gradient(circle, #FFE36AE6 0%, #FFE36A80 38%, #FFE36A00 68%); animation: halo 2.2s ease-in-out infinite; }
.bat .pouch svg { width: 100%; display: block; animation: pouchglow 2.2s ease-in-out infinite; }
.bat .pouch .glint { position: absolute; right: -16%; top: -10%; width: 40%; scale: 0; animation: glint 3.6s ease-in-out infinite;
  filter: drop-shadow(0 0 2px #FFFFFF); }
.bat.wobble .bb { animation: wobble .5s ease-in-out 2; }
.bat.perch .bb, .deco.perch svg { scale: .64; translate: 0 -24%; }
.deco svg { transition: scale .25s, translate .25s; }
.tile.spent .rot { filter: saturate(.45); }
.tile.nope { animation: nope .3s ease-in-out; }
.cell.can::after {
  content: ""; position: absolute; inset: 5px; border-radius: 18%;
  border: 5px dashed var(--pink); animation: gap .5s ease-in-out infinite alternate;
}
#char .bob.spring { animation: springhop var(--hop, .6s) cubic-bezier(.3,.1,.4,1); }
.star img { width: calc(var(--c) * .82); height: calc(var(--c) * .82); animation: twinkle 3s ease-in-out infinite; }
.star.ready img { animation: ready 1s ease-in-out infinite; }
/* A star asleep until the section's lesson is done: grey, still, and closed like a tree. */
.star.asleep img { filter: grayscale(1) brightness(1.15); opacity: .55; animation: none; }
.star.asleep.shake img { animation: wobble .4s ease-in-out; }
.star.wake img { animation: pop .6s cubic-bezier(.3,1.8,.5,1); }
.pickup.appear .pk { animation: pop .6s cubic-bezier(.3,1.8,.5,1), boingidle 3.2s ease-in-out .6s infinite; }
.tile.spent.t-b .rot { filter: none; }
.item.deco.under { z-index: 1; }

/* A lesson stone: a light shines down on a lit stepping stone and the friend or object floats in it.
   The beam stays inside its own square. When the lesson is done the light goes off. */
.lesson { z-index: 3; width: var(--c); height: var(--c); }
.lesson .beam { position: absolute; left: 50%; bottom: 36%; width: calc(var(--c) * .84); height: calc(var(--c) * .58); transform: translateX(-50%);
  clip-path: polygon(5% 100%, 95% 100%, 100% 0, 0 0);
  background: linear-gradient(to top, #FFE870F5, #FFF1A8D0 50%, #FFF6CC60 85%, #FFFFFF10); animation: beam 2.8s ease-in-out infinite; }
.lesson .mote { position: absolute; bottom: 40%; width: calc(var(--c) * .05); height: calc(var(--c) * .05); border-radius: 50%; background: var(--white);
  box-shadow: 0 0 6px #FFE14D; opacity: 0; animation: mote 2.4s ease-in infinite; }
.lesson .mote:nth-of-type(2) { left: 26%; }
.lesson .mote:nth-of-type(3) { left: 66%; animation-delay: .8s; }
.lesson .mote:nth-of-type(4) { left: 46%; animation-delay: 1.6s; }
.lesson .lstone { position: absolute; left: 50%; top: 64%; width: calc(var(--c) * .72); height: calc(var(--c) * .37); transform: translate(-50%, -50%); }
.lesson .lstone::before { content: ""; position: absolute; inset: 0; top: 10%; border-radius: 50%; background: #D8C38F; }
.lesson .lstone::after { content: ""; position: absolute; inset: 0; bottom: 10%; border-radius: 50%; background: #FFFDF2;
  box-shadow: 0 0 0 3px #FFF0A0, 0 0 12px 4px #FFE14DAA, inset 0 0 0 calc(var(--c) * .06) #FFF7CC; }
.lesson .lshadow { position: absolute; left: 50%; top: 62%; width: calc(var(--c) * .36); height: calc(var(--c) * .08); transform: translate(-50%, -50%);
  border-radius: 50%; background: #2A21481f; animation: shade 2.6s ease-in-out infinite; }
.lesson .lart { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); transition: scale .25s, translate .25s; }
.lesson .lart > div { width: 100%; height: 100%; animation: lfloat 2.6s ease-in-out infinite; }
.lesson .lart.object { width: calc(var(--c) * .74); height: calc(var(--c) * .74); }
.lesson .lart.person { width: calc(var(--c) * .54); height: calc(var(--c) * .56); }
.lesson .lart img, .lesson .lart svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 6px #FFE14D); }
.lesson.done .beam, .lesson.done .mote, .lesson.done .lshadow { display: none; }
.lesson.done .lstone::after { background: #EFE1C6; box-shadow: inset 0 0 0 calc(var(--c) * .06) #E6D3AE; }
.lesson.done .lstone::before { background: #CDB592; }
.lesson.done .lart > div { animation: none; }
.lesson.done .lart img, .lesson.done .lart svg { filter: drop-shadow(0 5px 0 #2A214833); }
/* While she stands on the stone, the friend steps up to the corner to make room. */
.lesson.perch .lart { scale: .55; translate: 42% -62%; }
.lesson.cheer .lart > div { animation: jump .8s cubic-bezier(.3,1.4,.5,1) 2; }

/* The lesson itself: a placeholder card for now. */
.lessoncard .lart { width: 150px; height: 150px; animation: hop 1.2s ease-in-out infinite; }
.lessoncard .lart img, .lessoncard .lart svg { width: 100%; height: 100%; display: block; }
.lessoncard .next { display: grid; place-items: center; padding: 12px 44px; }
.lessoncard .next svg { width: 56px; height: 40px; display: block; }
.star.won img { animation: spinwin 1.1s cubic-bezier(.3,1.4,.5,1) forwards; }
.flag svg { width: calc(var(--c) * .72); height: calc(var(--c) * .72); }
.pad svg { width: calc(var(--c) * .8); height: calc(var(--c) * .8); }
#char { z-index: 4; transition: transform var(--walk, .26s) linear; pointer-events: none; }
.still #char, .still .rot { transition: none !important; }
#char .bob { width: calc(var(--c) * .8); height: calc(var(--c) * .8); }
#char img { width: 100%; height: 100%; filter: drop-shadow(0 5px 0 #2A214833); }
#char .bob.hop { animation: hop .26s ease-out; }
#char .bob.jump { animation: jump .8s cubic-bezier(.3,1.4,.5,1) 2; }
.bubble {
  z-index: 6; pointer-events: none;
}
.bubble span {
  --bx: 0; --by: -.62;
  transform: translate(calc(var(--bx) * var(--c)), calc(var(--by) * var(--c)));
  font-family: var(--display); font-size: calc(var(--c) * .26); line-height: 1;
  color: var(--ink); background: var(--white);
  padding: .22em .45em .18em; border-radius: .6em;
  box-shadow: 0 4px 0 #2A214826;
  animation: bubble 1.6s cubic-bezier(.3,1.7,.5,1) forwards;
  white-space: nowrap;
}
.bubble.q span { font-size: calc(var(--c) * .36); color: var(--pink); }
.spot { z-index: 1; pointer-events: none; }
.spot::before {
  content: ""; width: calc(var(--c) * 1.1); height: calc(var(--c) * 1.1); border-radius: 50%;
  border: 6px solid var(--white); animation: spot .9s ease-out 2;
}
.spot.small::before { width: calc(var(--c) * .8); height: calc(var(--c) * .8); border: 5px solid var(--pink); }
#fog {
  position: absolute; z-index: 5; pointer-events: none;
  border-radius: calc(var(--c) * .14);
  box-shadow: 0 0 0 2000px #CDEEF7A6;
}
#edge {
  position: absolute; z-index: 5; pointer-events: none;
  width: calc(var(--c) * .3); height: calc(var(--c) * .3);
  transform: translate(-50%, -50%) rotate(var(--dir));
}
#edge svg { width: 100%; height: 100%; animation: nudge 1s ease-in-out infinite; }

/* ---------- tray ---------- */
#tray {
  position: absolute; display: flex; align-items: center; justify-content: center;
  gap: calc(var(--c) * .22);
  background: var(--panel); border: 5px solid var(--white); border-radius: calc(var(--c) * .22);
  box-shadow: 0 8px 0 #2A214822;
  transition: background .2s, box-shadow .2s;
}
#tray.col { flex-direction: column; }
#tray.bin { background: #FFE6F6; box-shadow: 0 8px 0 #2A214822, 0 0 0 6px #FF60CF66; }
.slot {
  position: relative; width: calc(var(--c) * 1.12); height: calc(var(--c) * 1.12);
  border-radius: calc(var(--c) * .2); background: var(--grass-a);
  box-shadow: inset 0 -6px 0 #00000014, 0 0 0 3px var(--panel-edge);
  cursor: grab; padding: calc(var(--c) * .06); border: 0;
}
.slot .rot { pointer-events: none; }
.slot.locked { background: #D9D2C6; cursor: default; }
.slot.locked .rot { opacity: .2; filter: grayscale(1); }
.slot .lock { position: absolute; inset: 0; display: none; place-items: center; pointer-events: none; }
.slot.locked .lock { display: grid; }
.slot .lock svg { width: 42%; height: 42%; }
.slot.unlock { animation: pop .6s cubic-bezier(.3,1.8,.5,1); }
.slot .count {
  position: absolute; top: -10px; right: -10px; min-width: 40px; height: 40px; padding: 0 8px;
  display: grid; place-items: center; pointer-events: none;
  font-family: var(--display); font-size: 22px; line-height: 1; color: var(--white);
  background: var(--pink); border: 3px solid var(--white); border-radius: 20px;
}
.slot.locked .count { display: none; }
.slot.empty { cursor: default; }
.slot.empty .rot { opacity: .3; filter: grayscale(1); }
.slot.empty .count { background: #A9A3B8; }
.slot.nope { animation: nope .3s ease-in-out; }
/* Four pieces: slightly smaller slots so they still fit. */
#tray.four { gap: calc(var(--c) * .12); }
#tray.four .slot { width: calc(var(--c) * .98); height: calc(var(--c) * .98); }

/* ---------- fx layer ---------- */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
.float, .ghost {
  position: absolute; left: 0; top: 0; width: var(--c); height: var(--c);
  filter: drop-shadow(0 12px 10px #2A214840);
}
.ghost { opacity: 0; filter: none; }
.float.back { transition: transform .3s cubic-bezier(.3,1.4,.5,1), opacity .3s; }
.hand { position: absolute; left: 0; top: 0; width: calc(var(--c) * .62); opacity: 0; filter: drop-shadow(0 6px 6px #2A214840); }
.hand svg { width: 100%; height: auto; display: block; }
.ripple { position: absolute; left: 0; top: 0; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 5px solid var(--white); opacity: 0; }
.puff { position: absolute; left: 0; top: 0; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--white); }
.confetti { position: absolute; left: 0; top: 0; width: 14px; height: 9px; border-radius: 3px; }
.flycoin { position: absolute; left: 0; top: 0; width: 50px; height: 50px; margin: -25px 0 0 -25px; }

/* ---------- overlays ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 80; display: grid; place-items: center;
  background: #2A214866; padding: 24px;
}
.card {
  background: var(--panel); border: 6px solid var(--white); border-radius: 36px;
  box-shadow: 0 10px 0 #2A214833; padding: 32px 40px 36px;
  display: grid; justify-items: center; gap: 14px; text-align: center; max-width: 560px;
}
.card h1, .card h2 { margin: 0; font-family: var(--display); font-weight: 400; color: var(--ink); text-wrap: balance; line-height: 1; }
.card h1 { font-size: clamp(44px, 8vw, 76px); letter-spacing: .01em; }
.card h2 { font-size: clamp(34px, 6vw, 54px); }
.card p { margin: 0; font-size: 20px; color: #5A5078; }
.hero { display: flex; align-items: flex-end; gap: 10px; }
.hero img { width: 120px; height: 120px; }
.hero img:nth-child(1) { animation: hop 1.2s ease-in-out infinite; }
.hero img:nth-child(2) { width: 70px; height: 70px; margin-bottom: 12px; }
.hero img:nth-child(3) { width: 96px; height: 96px; animation: twinkle 3s ease-in-out infinite; }
.btn {
  font-family: var(--display); font-size: 34px; color: var(--white); cursor: pointer;
  background: var(--pink); border: 0; border-radius: 999px; padding: 14px 52px 12px;
  box-shadow: 0 7px 0 #C2399C; margin-top: 8px;
}
.btn:active { transform: translateY(4px); box-shadow: 0 3px 0 #C2399C; }

@keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
@keyframes drop { 0% { transform: rotate(var(--rot)) scale(.75); } 100% { transform: rotate(var(--rot)) scale(1); } }
@keyframes ring { 0% { opacity: 1; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.15); } }
@keyframes gap { from { opacity: .25; } to { opacity: 1; } }
@keyframes shine { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) scale(1.05); } }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-16deg); } 75% { transform: rotate(16deg); } }
@keyframes twinkle { 0%, 100% { transform: rotate(0) scale(1); } 50% { transform: rotate(10deg) scale(1.04); } }
@keyframes ready { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 #FF60CF); } 50% { transform: scale(1.12); filter: drop-shadow(0 0 14px #FF60CF); } }
@keyframes spinwin { 0% { transform: scale(1) rotate(0); } 60% { transform: scale(1.5) rotate(300deg); } 100% { transform: scale(0) rotate(360deg); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-14%); } }
@keyframes jump { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-34%) scale(1.06); } }
@keyframes bubble {
  0% { opacity: 0; transform: translate(calc(var(--bx) * var(--c)), calc((var(--by) + .2) * var(--c))) scale(.4); }
  15%, 80% { opacity: 1; transform: translate(calc(var(--bx) * var(--c)), calc(var(--by) * var(--c))) scale(1); }
  100% { opacity: 0; transform: translate(calc(var(--bx) * var(--c)), calc((var(--by) - .08) * var(--c))) scale(1); }
}
@keyframes spot { 0% { opacity: 1; transform: scale(1.6); } 100% { opacity: 0; transform: scale(.7); } }

<script>
/* ================= world data =================
   Each section is 6×4. Map key: . meadow (buildable)  T tree  R rock  W pond (blocked)
   B bat (only a spring goes here)  P pouch bat (+3 coins when sprung over)  C coin  S spring on a stepping stone
   @ start  * star. Tap a spring stone to walk there and pick it up; unused springs stay in the tray for later sections.
   Pieces: 's' straight, 'c' corner, 'p' spring (a straight that only goes on a bat or rock and hops it).
   Rotation r = quarter turns clockwise. Straight/spring r0 = left–right. Corner r0 = left+down.
   Stars sit on the edge facing the next section; the character hops across into it.
   sol is the route the lessons point at;
   free-play hints work out a route on the fly. */
/* 13 sections, a lesson in every third one after the opening. The map is 4×3 with one more
   section at the top left, so the top row is five wide.
   Extra keys: G a bridge on a stepping stone (b goes on a pond and is crossed straight through)
   s / g  a spring or bridge stone that fills only once the section's lesson is done
   L a lesson stone. Where there is one, the star sleeps until the lesson is done.
   Straights, corners and springs are already known. It eases in one new thing at a time:
   1 drag one piece into the gap, then tap the star   2 turn a crooked piece, then swipe along the built road
   3 the bridge, on a road laid up to the pond   4 a first, gentle lesson with coin spurs to swipe down
   5 a spring stone to fetch and keep   6 the spring lesson: fetch one, drop it on the first pouch bat
   7 a lesson whose spring only fills once it's done, and so on. */
const SECTIONS = [
  { slot: [0, 0], next: 'E', map: ['TRTTRT', 'RTT@C*', 'TWTRTT', 'RTTWRT'], pre: [], sol: [[4, 1, 's', 0]] },
  { slot: [1, 0], next: 'E', map: ['TRTTRT', '@C.TTW', 'TTC.C*', 'RTRWTR'],
    pre: [[1, 1, 's', 0], [2, 1, 'c', 0], [2, 2, 'c', 2], [3, 2, 's', 1], [4, 2, 's', 0]], sol: [[3, 2, 's', 0]] },
  { slot: [2, 0], next: 'E', map: ['TRTWTT', 'TTRWRT', '@G.WC*', 'RTTWTR'],
    pre: [[2, 2, 's', 0], [4, 2, 's', 0]], sol: [[2, 2, 's', 0], [3, 2, 'b', 0], [4, 2, 's', 0]] },
  { slot: [3, 0], next: 'E', map: ['TRTCTW', 'T...RT', '@.TL.*', 'RCTTRW'], pre: [], sol: [[1, 2, 'c', 1]] },
  { slot: [4, 0], next: 'S', map: ['RCC.TT', 'T.T.ST', '@.W..R', 'TTTR*T'], pre: [], sol: [] },
  { slot: [4, 1], next: 'W', map: ['RTTT@T', 'TCP.SR', '*CTT.T', 'R....W'], pre: [], sol: [[2, 1, 'p', 0]] },
  { slot: [3, 1], next: 'W', map: ['TTCLTT', '*Rs.TR', 'TW...@', 'RWTCTT'], pre: [], sol: [] },
  { slot: [2, 1], next: 'W', map: ['TTRTST', 'C.P..@', '*RT.TT', '...C.T'], pre: [], sol: [] },
  { slot: [1, 1], next: 'S', map: ['TCW.GT', 'R.W..T', 'T.WT.@', 'R*WC.T'], pre: [], sol: [] },
  { slot: [1, 2], next: 'E', map: ['T@G.TT', 'CW.TTW', 'LW.sR*', 'TTC.TW'], pre: [], sol: [] },
  { slot: [2, 2], next: 'E', map: ['TCCB.T', 'TSTT.R', '@.R..*', 'T...TT'], pre: [], sol: [] },
  { slot: [3, 2], next: 'E', map: ['CCTSTT', 'GW..P.', '@.TW.*', 'T..C.T'], pre: [], sol: [] },
  { slot: [4, 2], next: null, map: ['T.L.TC', 'T.TgWC', '@.R.TR', 'RCTsW*'], pre: [], sol: [] },
];
const SW = 6, SH = 4, M = 0.35;            // section size, peek margin (in cells)
const STEP = 260;                          // ms per walked square
const BAT_COST = 40;
const DV = [[0, -1], [1, 0], [0, 1], [-1, 0]];   // N E S W
const DIRI = { N: 0, E: 1, S: 2, W: 3 };
const BASE = { s: [1, 3], c: [2, 3], p: [1, 3], b: [1, 3] };
const DRAG_SEC = 0, SWIPE_SEC = 1, BRIDGE_SEC = 2;   // sections where each move is taught
const LAY_SEC = 3;                                   // the first corner she lays herself
const SPRING_SEC = 5;                                // the first pouch bat, and the hand shows the spring on it
const K = (x, y) => x + ',' + y;
const P = k => k.split(',').map(Number);
const conns = (type, r) => BASE[type].map(d => (d + r) % 4);
const sameConns = (a, b) => a.length === b.length && a.every(d => b.includes(d));
const sleep = ms => new Promise(r => setTimeout(r, ms));

const SEC = SECTIONS.map((s, i) => {
  const ox = s.slot[0] * SW, oy = s.slot[1] * SH;
  const w = ([x, y, ...rest]) => [ox + x, oy + y, ...rest];
  let start, star, lesson = null; const bats = [], pouches = [], coins = [], pickups = [], block = [];
  s.map.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '@') start = [x, y]; else if (ch === '*') star = [x, y]; else if (ch === 'L') lesson = [x, y];
    else if (ch === 'B') bats.push([x, y]); else if (ch === 'P') { bats.push([x, y]); pouches.push([x, y]); }
    else if (ch === 'C') coins.push([x, y]);
    else if ('SsGg'.includes(ch)) pickups.push([x, y, 'Ss'.includes(ch) ? 'p' : 'b', ch === 's' || ch === 'g']);   // [x, y, piece, waits for the lesson]
    else if ('TRW'.includes(ch)) block.push([x, y, ch]);
  }));
  return { ...s, i, ox, oy, start, star, startW: w(start), starW: w(star), lessonW: lesson && w(lesson), batsW: bats.map(w), pouchesW: pouches.map(w),
    coinsW: coins.map(w), pickupsW: pickups.map(w), blockW: block.map(w), preW: s.pre.map(w), solW: s.sol.map(w) };
});
const BATS = new Set(SEC.flatMap(s => s.batsW.map(([x, y]) => K(x, y))));
const PICKUPS = new Map(SEC.flatMap(s => s.pickupsW.map(([x, y, type, later]) => [K(x, y), { type, later, sec: s.i }])));
const LESSON_AT = new Map(SEC.filter(s => s.lessonW).map((s, n) => [K(...s.lessonW), n]));   // lesson stone -> lesson number
const POUCH = new Set(SEC.flatMap(s => s.pouchesW.map(([x, y]) => K(x, y))));
const BLOCK = new Map(SEC.flatMap(s => s.blockW.map(([x, y, ch]) => [K(x, y), ch])));
const COIN_SET = new Set(SEC.flatMap(s => s.coinsW.map(([x, y]) => K(x, y))));
const COINS_TOTAL = COIN_SET.size + 3 * POUCH.size + 3 * LESSON_AT.size;

/* ================= sound (all synthesized) ================= */
const Snd = (() => {
  let ac, master, mus, sfx, nbuf, on = true, timer = null, step = 0, nextT = 0;
  const mid = n => 440 * Math.pow(2, (n - 69) / 12);
  const _ = null;
  const LEAD = [76,79,84,79,81,79,76,_, 77,81,84,81,79,76,74,_, 76,79,84,79,81,84,86,_, 84,_,79,_,76,_,72,_,
                69,72,77,72,67,71,74,79, 69,72,76,81,79,77,76,74, 77,76,74,72,74,76,77,79, 84,_,79,76,72,_,_,_];
  const BASS = [48,43,48,43, 41,48,41,48, 48,43,48,43, 43,50,43,47, 41,48,43,50, 45,52,45,52, 41,43,45,47, 48,43,48,_];
  const SPB = 60 / 132 / 2;
  function init() {
    if (ac) { ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
    mus = ac.createGain(); mus.gain.value = on ? 0.15 : 0; mus.connect(master);
    sfx = ac.createGain(); sfx.gain.value = 0.55; sfx.connect(master);
    nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    document.addEventListener('visibilitychange', () => document.hidden ? ac.suspend() : ac.resume());
  }
  function tone(f, t, d, type = 'square', v = .3, f2 = null, dest = sfx) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + 0.03);
  }
  function noise(t, d, v, f1, f2, q = 1, dest = sfx, type = 'bandpass') {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nbuf; f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + d * .2);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t + d + .02);
  }
  function schedule() {
    while (nextT < ac.currentTime + 0.12) {
      const i = step % 64;
      if (LEAD[i]) tone(mid(LEAD[i]), nextT, SPB * .9, 'square', .16, null, mus);
      if (i % 2 === 0 && BASS[i / 2]) tone(mid(BASS[i / 2]), nextT, SPB * 1.8, 'triangle', .45, null, mus);
      if (i % 2 === 1) noise(nextT, .05, .08, 8000, 7000, .7, mus, 'highpass');
      nextT += SPB; step++;
    }
  }
  const T = () => ac.currentTime + 0.005;
  const S = {
    init,
    startMusic() { if (!ac || timer) return; nextT = ac.currentTime + .1; timer = setInterval(schedule, 25); },
    toggle() { on = !on; if (mus) mus.gain.setTargetAtTime(on ? .15 : 0, ac.currentTime, .05); return on; },
    get on() { return on; },
  };
  const fx = {
    pick() { const t = T(); tone(620, t, .08, 'square', .12, 930); },
    drop() { const t = T(); tone(190, t, .14, 'sine', .55, 90); tone(880, t + .02, .06, 'square', .07); },
    spin() { const t = T(); tone(480, t, .12, 'triangle', .35, 960); },
    whoosh() { const t = T(); noise(t, .4, .45, 3000, 280, .8); },
    no() { const t = T(); tone(170, t, .09, 'square', .14); tone(130, t + .11, .13, 'square', .14); },
    step() { const t = T(); tone(300 + Math.random() * 60, t, .05, 'triangle', .14); },
    coin() { const t = T(); [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, t + i * .055, .12, 'square', .13)); },
    oops() { const t = T(); tone(420, t, .14, 'square', .18, 260); tone(320, t + .16, .3, 'square', .18, 150);
             [0, .09, .18].forEach(d => noise(t + d, .07, .3, 900, 500, 2)); },
    puzzled() { const t = T(); tone(480, t, .1, 'sine', .35, 720); tone(520, t + .15, .16, 'sine', .35, 860); },
    fanfare() { const t = T(); [72, 76, 79, 84].forEach((n, i) => tone(mid(n), t + i * .1, .14, 'square', .14));
                [84, 88, 91].forEach(n => tone(mid(n), t + .42, .7, 'square', .09)); tone(mid(48), t + .42, .7, 'triangle', .4); },
    ping() { const t = T(); tone(1568, t, .3, 'sine', .25); tone(2093, t + .09, .35, 'sine', .2); },
    unlock() { const t = T(); [84, 88, 91, 96, 100].forEach((n, i) => tone(mid(n), t + i * .06, .2, 'triangle', .3)); },
    swoosh() { const t = T(); noise(t, .8, .3, 350, 2200, .7); },
    hop() { const t = T(); tone(380, t, .14, 'sine', .3, 820); },
    tap() { const t = T(); tone(900, t, .04, 'sine', .15); },
    bonk() { const t = T(); tone(150, t, .16, 'sine', .6, 70); noise(t, .08, .25, 1200, 600, 1.5); },
    splash() { const t = T(); noise(t, .32, .35, 1800, 500, 1); tone(600, t, .1, 'sine', .25, 1200); },
    boing() { const t = T(); tone(180, t, .35, 'triangle', .5, 720); tone(240, t + .05, .3, 'sine', .25, 960); },
    eek() { const t = T(); tone(1400, t, .08, 'square', .1, 2000); tone(1600, t + .1, .1, 'square', .1, 2400);
            [0, .07, .14, .21].forEach(d => noise(t + d, .06, .25, 900, 500, 2)); },
  };
  for (const k in fx) S[k] = () => { if (ac) try { fx[k](); } catch (e) {} };
  return S;
})();

/* ================= state ================= */
let S;            // game state (serializable)
let started = false, busy = false;
let lastAct = performance.now(), lastChange = performance.now();
let hintTok = 0, hintActive = false, hintAnims = [], hintEls = [];
let drag = null, press = null;
let cpx = 140;    // cell size in px

function freshState() {
  const tiles = {};
  SEC.forEach(s => s.preW.forEach(([x, y, t, r]) => tiles[K(x, y)] = { type: t, turns: r }));
  return { sec: 0, tiles, taken: [], flown: [], picked: [], bag: 0, bridges: 0, learned: [], score: 0, char: [...SEC[0].startW], shown: [],
    oops: false, bridgeUnlocked: false, swiped: false, fails: 0, clock: 0 };   // clock: when each piece was last built or turned
}

/* ================= dom refs ================= */
const $ = s => document.querySelector(s);
const stage = $('#stage'), board = $('#board'), world = $('#world'), tray = $('#tray'), fx = $('#fx');
const coinsEl = $('#coins'), coinN = $('#coinN'), edge = $('#edge');
const els = { tiles: new Map(), coins: new Map(), pickups: new Map(), lessons: new Map(), bats: new Map(), deco: new Map(), stars: [], cells: new Map(), char: null };

/* ================= art ================= */
function roadSVG(type) {
  // The bridge: wooden planks between two rope rails, laid across the pond.
  if (type === 'b') return `<svg class="road" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    ${[0, 1, 2, 3, 4, 5, 6].map(i => `<rect x="${i * 14.5 - 1}" y="25" width="11.5" height="50" rx="2.5" fill="#D9A066" stroke="#8A5A3B" stroke-width="3"/>`).join('')}
    <path d="M-2 24H102M-2 76H102" stroke="#8A5A3B" stroke-width="5" stroke-linecap="round"/></svg>`;
  const d = type === 'c' ? 'M-2 50H0A50 50 0 0 1 50 100V102' : 'M-2 50H102';
  // The spring is a straight road with a springboard on it; the zigzag runs the way she bounces.
  const board = type === 'p' ? `<rect x="20" y="24" width="60" height="52" rx="13" fill="#FF8AD8" stroke="#C2399C" stroke-width="4"/>
    <path d="M27 50l7-13 7 26 7-26 7 26 7-26 7 26 4-13" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  return `<svg class="road" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <path class="re" d="${d}" stroke-width="56"/><path class="rf" d="${d}" stroke-width="42"/>
    <path class="rd" d="${d}" stroke-width="5" stroke-dasharray="9 11" stroke-linecap="round"/>${board}</svg>`;
}
// The pouch, with a gold coin peeking out of its open top, and the glint that flashes on it.
const POUCH_SVG = `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="9" r="7.5" fill="#FFC200" stroke="#E59A00" stroke-width="2"/>
  <circle cx="20" cy="9" r="4" fill="none" stroke="#FFE27A" stroke-width="2"/>
  <path d="M14 13C6 18 5 36 20 36s14-18 6-23z" fill="#C98A4B" stroke="#7A4A2B" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M13 12.5c4 2 10 2 14 0" stroke="#7A4A2B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M12 24c1-4 3-7 5-8" stroke="#E2AE77" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>`;
const GLINT_SVG = `<svg class="glint" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0l2.4 7.6L20 10l-7.6 2.4L10 20l-2.4-7.6L0 10l7.6-2.4z" fill="#FFFFFF" stroke="#F2A900" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
const SPRING_ICON = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="16" y="22" width="68" height="56" rx="15" fill="#FF8AD8" stroke="#C2399C" stroke-width="5"/>
  <path d="M24 50l8-14 8 28 8-28 8 28 8-28 8 28 4-14" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
const BRIDGE_ICON = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="16" y="22" width="68" height="56" rx="15" fill="#F2C48C" stroke="#8A5A3B" stroke-width="5"/>
  <path d="M33 30v40M50 30v40M67 30v40" stroke="#8A5A3B" stroke-width="5" stroke-linecap="round"/><path d="M24 40h52M24 60h52" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/></svg>`;
const ICON = { p: SPRING_ICON, b: BRIDGE_ICON };
// Lesson friends, one for each lesson, in order. A character comes as a round portrait;
// an object (kind 'object') would be drawn free and a little larger.

/* ================= rules ================= */
function inSec(x, y, s = SEC[S.sec]) { return x >= s.ox && x < s.ox + SW && y >= s.oy && y < s.oy + SH; }
// Stepping stones: the start, the star, lesson stones and spring or bridge stones. They connect on every side and take no pieces.
// A sleeping star is closed, like a tree.
function isHub(x, y) {
  const s = SEC[S.sec], k = K(x, y);
  if (k === K(...s.starW)) return !starAsleep();
  return k === K(...s.startW) || ((PICKUPS.has(k) || LESSON_AT.has(k)) && inSec(x, y));
}
function batActive(k) { return BATS.has(k) && !S.flown.includes(k); }
// Springs only go on a bat or rock, bridges only on a pond; other pieces only on open meadow.
// A spring she has already bounced on, or a bridge she has crossed, stays put.
function canPlace(type, x, y) {
  const k = K(x, y);
  if (!inSec(x, y) || isHub(x, y) || k === K(...SEC[S.sec].starW) || S.tiles[k]?.spent) return false;
  if (type === 'p') return BLOCK.get(k) === 'R' || batActive(k);
  if (type === 'b') return BLOCK.get(k) === 'W';
  return !BLOCK.has(k) && !batActive(k);
}
// Springs and bridges are counted pieces: the tray holds what she has collected.
const COUNTED = ['p', 'b'];
function give(type, n = 1) { if (type === 'p') S.bag += n; else if (type === 'b') S.bridges += n; }
function held(type) { return type === 'p' ? S.bag : type === 'b' ? S.bridges : Infinity; }
function batOops(k, off = null) {
  const bat = els.bats.get(k); if (!bat) return;
  bat.classList.remove('wobble'); void bat.offsetWidth; bat.classList.add('wobble');
  bubble(...P(k), 'Oops!', '', off); Snd.oops();
  S.oops = true;
}
// Springs in the tray. Placing one takes it out; taking an unused one back off the board puts it back.
function springsLeft() { return S.bag; }
function placedSprings(type = 'p') { return Object.keys(S.tiles).filter(k => S.tiles[k].type === type && !S.tiles[k].spent && inSec(...P(k))); }
// The piece waiting on this stone right now (a stone that waits for the lesson isn't filled yet).
function pickupHere(k) { return els.pickups.has(k) && inSec(...P(k)) ? PICKUPS.get(k).type : null; }
function bonk(k) {
  const d = els.deco.get(k); if (!d) return;
  d.classList.remove('wobble'); void d.offsetWidth; d.classList.add('wobble');
  BLOCK.get(k) === 'W' ? Snd.splash() : Snd.bonk();
}
function open(x, y, d) {
  const k = K(x, y);
  if (isHub(x, y)) return true;     // stepping stones connect on every side
  const t = S.tiles[k]; return !!t && conns(t.type, t.turns % 4).includes(d);
}
function dijkstra(sx, sy) {
  const dist = new Map([[K(sx, sy), 0]]), prev = new Map(), q = [[0, sx, sy]];
  while (q.length) {
    q.sort((a, b) => a[0] - b[0]);
    const [d0, x, y] = q.shift();
    if (d0 > dist.get(K(x, y))) continue;
    for (let d = 0; d < 4; d++) {
      const nx = x + DV[d][0], ny = y + DV[d][1], nk = K(nx, ny);
      if (!inSec(nx, ny) || !open(x, y, d) || !open(nx, ny, (d + 2) % 4)) continue;
      const nd = d0 + (batActive(nk) && S.tiles[nk]?.type !== 'p' ? BAT_COST : 1);
      if (!dist.has(nk) || nd < dist.get(nk)) { dist.set(nk, nd); prev.set(nk, K(x, y)); q.push([nd, nx, ny]); }

function starClean() {
  const { dist } = dijkstra(...S.char), d = dist.get(K(...goalW()));

}
function solOK(sol) { const t = S.tiles[K(sol[0], sol[1])]; return !!t && t.type === sol[2] && sameConns(conns(t.type, t.turns % 4), conns(sol[2], sol[3])); }

/* ================= moving the character ================= */
async function walkTo(tx, ty) {
  const here = K(...S.char);
  if (here === K(tx, ty)) { bob(); Snd.hop(); placeEdge(); return; }
  const { dist, prev } = dijkstra(...S.char);
  let goal = K(tx, ty); const reached = dist.has(goal);
  if (!reached) goal = roadEnd(dist, prev, tx, ty);
  const path = []; for (let k = goal; k && k !== here; k = prev.get(k)) path.unshift(k);
  return walkPath(path, reached ? null : [tx, ty]);
}
// Walk a list of squares. short: the target she was sent to but can't reach (null when she got there, or for a swipe).
async function walkPath(path, short, swiped = false) {
  busy = true; edge.hidden = true;
  const s = SEC[S.sec], got = S.score + S.picked.length;
  for (let i = 0; i < path.length; i++) {
    let k = path[i];
    if (S.tiles[k]?.type === 'p') {                     // bounce over the spring square, landing on the next one
      const n = path[i + 1];
      if (!n) break;
      if (batActive(n) && S.tiles[n]?.type !== 'p') { await bump(...P(n)); failed(); return done(); }
      await springHop(k, n); i++; k = n;
    } else {
      const [x, y] = P(k);
      if (batActive(k)) { await bump(x, y); failed(); return done(); }
      S.char = [x, y]; setChar(x, y); bob(); Snd.step(); perchLesson();
      if (S.tiles[k]?.type === 'b') S.tiles[k].spent = true;      // a crossed bridge stays where it is
      await sleep(STEP);
    }
    if (els.coins.has(k)) collect(k);
    if (els.pickups.has(k)) collectSpring(k);
    if (k === K(...s.starW) && !starAsleep()) return win();
    if (LESSON_AT.has(k) && !S.learned.includes(k)) { await runLesson(k); return done(); }
  }
  // Short of the target: a walk that found coins or a piece ends happily; one that found nothing is puzzled.
  // A swipe that found something ends with the same happy hop.
  const found = S.score + S.picked.length > got;
  if (short) { if (found) { bob('jump'); Snd.hop(); } else { puzzled(...short); failed(); } }
  else if (swiped && found) { bob('jump'); Snd.hop(); }
  return done();
  function done() { busy = false; perchLesson(); placeEdge(); changed(); }
}
/* Swipe from the character: she sets off that way and follows the road until it ends,
   or until she reaches a stepping stone. Nothing built that way: she leans over and comes back. */
function swipeRoute(d) {
  const path = [], seen = new Set([K(...S.char)]);
  let [x, y] = S.char, dir = d;
  for (;;) {
    const nx = x + DV[dir][0], ny = y + DV[dir][1], nk = K(nx, ny);
    if (!open(x, y, dir) || !inSec(nx, ny) || !open(nx, ny, (dir + 2) % 4) || seen.has(nk)) break;
    path.push(nk); seen.add(nk); x = nx; y = ny;
    if (isHub(nx, ny)) break;
    const t = S.tiles[nk], exits = conns(t.type, t.turns % 4).filter(e => e !== (dir + 2) % 4);
    if (exits.length !== 1) break;
    dir = exits[0];
  }
  return path;
}
async function swipeWalk(d) {
  S.swiped = true;
  const path = swipeRoute(d);
  if (path.length) return walkPath(path, null, true);
  busy = true;
  const [cx, cy] = S.char;
  setChar(cx + DV[d][0] * .22, cy + DV[d][1] * .22); bob(); Snd.no();
  await sleep(180); setChar(cx, cy); await sleep(200);
  busy = false;
}
// The first swipe worth showing: a direction where the road carries her at least two squares.
function swipeHint() {
  for (let d = 0; d < 4; d++) if (swipeRoute(d).length >= 2) return { kind: 'swipe', cell: [...S.char], dir: d };
  return null;
}

/* ================= lessons ================= */
let lessonDone = null;
function openLessonCard(n) {
  const card = $('#lessoncard');
  card.querySelector('.lart').innerHTML = friend(n).art(false);
  card.hidden = false;
  return new Promise(r => { lessonDone = r; });
}
// Reaching a lesson stone: the lesson card, then coins burst out like a pouch bat's,
// the light goes off, the friend cheers, the star wakes and any waiting stones fill.
async function runLesson(k) {
  const s = SEC[S.sec], n = LESSON_AT.get(k), el = els.lessons.get(k);
  cancelHint(); bob('jump'); Snd.unlock();
  await sleep(700);
  await openLessonCard(n);
  $('#lessoncard').hidden = true; Snd.tap();
  S.learned.push(k);
  el.innerHTML = lessonHTML(n, true); el.classList.add('done', 'cheer');
  const [cx, cy] = cellCenter(...P(k));
  burst(cx, cy, 16); Snd.fanfare();
  for (let j = 0; j < 3; j++) { flyCoin(cx, cy, 250 + j * 140); setTimeout(Snd.coin, 250 + j * 140); }
  flyLesson(n, [cx, cy]);
  await sleep(1500);
  el.classList.remove('cheer');
  const st = els.stars[S.sec];
  st.classList.remove('asleep'); st.classList.add('wake');
  mk('spot', ...s.starW).addEventListener('animationend', e => e.target.remove());
  Snd.ping();
  await sleep(900);
  st.classList.remove('wake');
  const later = s.pickupsW.filter(([x, y, , l]) => l && !S.picked.includes(K(x, y)));
  later.forEach(([x, y, type]) => showPickup(x, y, type).classList.add('appear'));
  if (later.length) { Snd.boing(); await sleep(700); }
  paintStars();
}
// Tapping the star while it sleeps: it wobbles and the lesson stone rings.
function nudgeLesson() {
  const st = els.stars[S.sec];
  st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake');
  Snd.no();
  mk('spot', ...SEC[S.sec].lessonW).addEventListener('animationend', e => e.target.remove());
  setTimeout(() => Snd.ping(), 250);
}
// When the road doesn't reach the target she follows it to where it runs out. She heads for the road
// the child built (or turned) last: of the dead ends she can reach past that piece, the one closest
// to the target. With no road built, she stays put.
// A spring stone counts as a road end too, when the child built road to it or it brings her closer to the target.
function roadEnd(dist, prev, tx, ty) {

      act: () => hintForSol(SEC[BRIDGE_SEC].solW[1]) }],
  // Straight away the hand swipes from her along the road, which carries her up to a piece turned the wrong way.
  // Then it taps that piece to turn it. (While the road is broken, tapping the star only gets her as far as the swipe does.)
  [SWIPE_SEC]: [{ id: 'swipe', when: () => !!swipeHint(), done: () => S.swiped, act: () => swipeHint() },
    { id: 'turn', done: () => solOK(SEC[SWIPE_SEC].solW[0]), act: () => ({ kind: 'rotate', cell: SEC[SWIPE_SEC].solW[0] }) }],
  // The first turn she lays: drag it out of the tray next to her, then tap it round until it points up through the gap in the trees.
  // Tap the spring on its stone to go and get it (unless one is already in hand), then drop it on the pouch bat.
  [SPRING_SEC]: [
    { id: 'fetch', when: () => S.bag === 0 && !solOK(SEC[SPRING_SEC].solW[0]), done: () => S.picked.includes(K(...SEC[SPRING_SEC].pickupsW[0])),
      act: () => ({ kind: 'tap', cell: SEC[SPRING_SEC].pickupsW[0] }) },
    { id: 'spring', when: () => S.bag > 0, done: () => solOK(SEC[SPRING_SEC].solW[0]) || S.flown.includes(K(...SEC[SPRING_SEC].pouchesW[0])),
      act: () => hintForSol(SEC[SPRING_SEC].solW[0]) }],
  [LAY_SEC]: [{ id: 'drag', done: () => !!S.tiles[K(...SEC[LAY_SEC].solW[0])], act: () => hintForSol(SEC[LAY_SEC].solW[0]) },
    { id: 'turnc', when: () => !!S.tiles[K(...SEC[LAY_SEC].solW[0])], done: () => solOK(SEC[LAY_SEC].solW[0]), act: () => hintForSol(SEC[LAY_SEC].solW[0]) }],
};
// If she never swiped where it was taught (the star got tapped first), the hand shows the swipe again,
// once a section, whenever there's road ahead of her to swipe along, until she has swiped once.
const SWIPE_AGAIN = { id: 'swipe', when: () => S.sec > SWIPE_SEC && !S.swiped && !!swipeHint(), done: () => S.swiped, act: () => swipeHint() };
function pendingLesson() {
  return [...(LESSONS[S.sec] || []), SWIPE_AGAIN].find(l => !S.shown.includes(S.sec + l.id) && (!l.when || l.when()) && !l.done());
}
function hintForSol([x, y, type, r]) {
  const t = S.tiles[K(x, y)];
  if (!t || t.type !== type) return { kind: 'drag', type, cell: [x, y] };   // dropping on a wrong piece swaps it
  return { kind: 'rotate', cell: [x, y] };
}
// When stuck: find every route from where she stands to the star (or to the lesson, while the star sleeps),
// pick the one closest to what's already built, and point at its first square that still needs a change.
// A route can use springs she has (tray or placed but unused) plus ones she picks up along it,
// but a picked-up spring has to be fetched first: build out to its stone and tap it. Bridges work the same way.
function computeHint() {
  const s = SEC[S.sec], gw = goalW(), star = K(...gw), sleeping = K(...s.starW);
  if (starClean()) return { kind: 'tap', cell: gw };
  const placed = placedSprings(), have = S.bag + placed.length;
  const kind = (x, y) => {
    if (!inSec(x, y)) return 'no';
    const k = K(x, y), t = S.tiles[k], b = BLOCK.get(k);
    if (k === star) return 'star';
    if (k === sleeping) return 'no';
    if (isHub(x, y)) return 'open';
    if (t?.type === 'p') return t.spent ? 'spent' : 'spring';
    if (t?.type === 'b') return 'bridge';
    if (b === 'W') return 'bridgeable';
    if (b === 'T') return 'no';
    return b === 'R' || batActive(k) ? 'springable' : 'open';
  };
  let best = null;
  const path = [S.char], dirs = [], seen = new Set([K(...S.char)]);
  const finish = () => {
    let miss = 0, hit = 0, first = null;
    // More springs (or bridges) needed than she holds: only the road up to the first stone holding one can be built now.
    const keys = path.map(p => K(...p));
    const fresh = keys.filter(k => kind(...P(k)) === 'springable').length;
    const spare = S.bag + placed.filter(k => !keys.includes(k)).length;
    const freshB = keys.filter(k => kind(...P(k)) === 'bridgeable').length;
    let limit = path.length;
    if (fresh > spare) limit = Math.min(limit, keys.findIndex(k => pickupHere(k) === 'p'));
    if (freshB > S.bridges) limit = Math.min(limit, keys.findIndex(k => pickupHere(k) === 'b'));
    path.forEach(([x, y], i) => {
      if (i === path.length - 1) return;                       // the star
      const k = K(x, y), t = S.tiles[k];
      let need;
      if (i === 0) {                                           // where she stands only has to face the first step
        if (isHub(x, y) || (t && conns(t.type, t.turns % 4).includes(dirs[0]))) return;
        need = { kind: 'rotate', cell: [x, y] };
      } else {
        if (isHub(x, y)) return;
        const a = (dirs[i - 1] + 2) % 4, b = dirs[i];
        const sk = kind(x, y), type = sk === 'spring' || sk === 'springable' || sk === 'spent' ? 'p'
          : sk === 'bridge' || sk === 'bridgeable' ? 'b' : a % 2 === b % 2 ? 's' : 'c';
        const r = [0, 1, 2, 3].find(r => sameConns(conns(type, r), [a, b]));
        if (t && t.type === type && sameConns(conns(t.type, t.turns % 4), [a, b])) { hit++; return; }
        need = t && t.type === type ? { kind: 'rotate', cell: [x, y] } : { kind: 'drag', type, cell: [x, y], r };
      }
      miss++; if (i <= limit) first = first || need;
    });
    if (!first && limit >= 0 && limit < path.length) first = { kind: 'tap', cell: path[limit] };   // road reaches the spring: tap it to go and get it
    // Keep springs and bridges in hand when there's a way round on land (ones the child already laid don't count),
    // then reuse what they built, then fewest changes, then shortest.
    const score = (fresh + freshB) * 100000 - hit * 10000 + miss * 100 + path.length;
    if (!best || score < best.score) best = { score, first };
  };
  // used / cap count springs, usedB / capB bridges.
  const dfs = (x, y, used, cap, usedB, capB) => {
    for (let d = 0; d < 4; d++) {
      const nx = x + DV[d][0], ny = y + DV[d][1], nk = K(nx, ny);
      if (seen.has(nk)) continue;
      const kd = kind(nx, ny);
      if (kd === 'no') continue;
      if (kd === 'star') { path.push([nx, ny]); dirs.push(d); finish(); path.pop(); dirs.pop(); continue; }
      if (kd === 'open') {
        const pk = pickupHere(nk);
        seen.add(nk); path.push([nx, ny]); dirs.push(d); dfs(nx, ny, used, cap + (pk === 'p'), usedB, capB + (pk === 'b')); seen.delete(nk); path.pop(); dirs.pop(); continue;
      }
      // spring and bridge squares are crossed straight through and need open ground (or the star) on the far side
      const take = kd === 'spring' || kd === 'springable' ? 1 : 0, takeB = kd === 'bridgeable' ? 1 : 0;
      if (used + take > cap || usedB + takeB > capB) continue;
      const lx = nx + DV[d][0], ly = ny + DV[d][1], lk = K(lx, ly), lkind = kind(lx, ly);
      if (seen.has(lk) || !['open', 'star'].includes(lkind)) continue;
      if ((kd === 'spent' || (kd === 'bridge' && S.tiles[nk].spent)) && !conns(S.tiles[nk].type, S.tiles[nk].turns % 4).includes(d)) continue;
      seen.add(nk); path.push([nx, ny]); dirs.push(d);
      if (lkind === 'star') { path.push([lx, ly]); dirs.push(d); finish(); path.pop(); dirs.pop(); }
      else {
        const pk = pickupHere(lk);
        seen.add(lk); path.push([lx, ly]); dirs.push(d);
        dfs(lx, ly, used + take, cap + (pk === 'p'), usedB + takeB, capB + (pk === 'b'));
        seen.delete(lk); path.pop(); dirs.pop();
      }
      seen.delete(nk); path.pop(); dirs.pop();
    }
  };

  if (!best || !best.first) return { kind: 'tap', cell: s.starW };
  // The route needs a spring the tray can't give: a spring sitting off the route has to come back first.
  if (best.first.type === 'p' && S.bag < 1 && placed.length) return { kind: 'remove', cell: P(placed[0]) };
  return best.first;
}
function cancelHint() {
  hintTok++; hintAnims.forEach(a => a.cancel()); hintEls.forEach(e => e.remove());
  hintAnims = []; hintEls = []; hintActive = false;
}
function hEl(cls, html = '') { const e = document.createElement('div'); e.className = cls; e.innerHTML = html; fx.append(e); hintEls.push(e); return e; }
async function showHint(h) {
  if (!h) return;
  cancelHint(); const tok = ++hintTok; hintActive = true;
  const hand = hEl('hand', HAND);
  const hw = cpx * .62, hh = hw * 102 / 80;
  const HT = ([x, y], s = 1) => `translate(${x - hw * HAND_TIP[0]}px, ${y - hh * HAND_TIP[1]}px) scale(${s})`;
  const GT = ([x, y], s = 1) => `translate(${x - cpx / 2}px, ${y - cpx / 2}px) scale(${s})`;
  hand.style.transformOrigin = `${HAND_TIP[0] * 100}% ${HAND_TIP[1] * 100}%`;
  const anim = (el, kf, dur) => { const a = el.animate(kf, { duration: dur, easing: 'ease-in-out', fill: 'forwards' }); hintAnims.push(a); return a.finished.catch(() => {}); };
  const ripple = (p, delay) => { const r = hEl('ripple'); anim(r, [
    { transform: `translate(${p[0]}px,${p[1]}px) scale(.3)`, opacity: 0, offset: 0 },
    { transform: `translate(${p[0]}px,${p[1]}px) scale(.3)`, opacity: .9, offset: delay },
    { transform: `translate(${p[0]}px,${p[1]}px) scale(1.5)`, opacity: 0, offset: Math.min(1, delay + .2) },
    { transform: `translate(${p[0]}px,${p[1]}px) scale(1.5)`, opacity: 0, offset: 1 }], 1900); };
  const tapAt = p => {
    ripple(p, .3); ripple(p, .55);
    return anim(hand, [
      { transform: HT([p[0] + cpx * .3, p[1] + cpx * .45]), opacity: 0 },
      { transform: HT(p), opacity: 1, offset: .2 },
      { transform: HT(p, .85), offset: .3 }, { transform: HT(p), offset: .4 },
      { transform: HT(p, .85), offset: .55 }, { transform: HT(p), offset: .65 },
      { transform: HT(p), opacity: 1, offset: .85 }, { transform: HT(p), opacity: 0 }], 1900);
  };
  if (h.kind === 'swipe') {                       // press on her and flick the way the road goes, twice
    const a = cellCenter(...h.cell), b = [a[0] + DV[h.dir][0] * cpx * .95, a[1] + DV[h.dir][1] * cpx * .95];
    for (let i = 0; i < 2 && tok === hintTok; i++) await anim(hand, [
      { transform: HT([a[0] + cpx * .3, a[1] + cpx * .45]), opacity: 0 },
      { transform: HT(a), opacity: 1, offset: .25 }, { transform: HT(a, .85), offset: .35 },
      { transform: HT(b, .85), offset: .6 }, { transform: HT(b), opacity: 1, offset: .75 },
      { transform: HT(b), opacity: 0 }], 1500);
  }
  else if (h.kind === 'tap') await tapAt(cellCenter(...h.cell));
  else if (h.kind === 'rotate') await tapAt(cellCenter(...h.cell));
  else if (h.kind === 'drag' || h.kind === 'remove') {
    let a, b, type, turns = 0;
    if (h.kind === 'drag') { a = centerOf(tray.querySelector(`[data-piece="${h.type}"]`)); b = cellCenter(...h.cell); type = h.type; }
    else {
      const t = S.tiles[K(...h.cell)]; type = t.type; turns = t.turns; a = cellCenter(...h.cell);
      const br = board.getBoundingClientRect(), s = SEC[S.sec], [lx, ly] = [h.cell[0] - s.ox, h.cell[1] - s.oy];
      const opts = [[lx + 1, [br.left - cpx * .2, a[1]]], [SW - lx, [br.right + cpx * .2, a[1]]], [ly + 1, [a[0], br.top - cpx * .1]], [SH - ly, [a[0], br.bottom + cpx * .2]]];
      b = opts.sort((p, q) => p[0] - q[0])[0][1];

    const ghost = hEl('ghost', `<div class="rot" style="--rot:${turns * 90}deg;transition:none">${roadSVG(type)}</div>`);
    anim(ghost, [
      { transform: GT(a), opacity: 0 }, { transform: GT(a), opacity: 0, offset: .22 },
      { transform: GT(a, 1.06), opacity: .75, offset: .28 }, { transform: GT(b, 1.06), opacity: .75, offset: .72 },
      { transform: GT(b, h.kind === 'remove' ? .5 : 1), opacity: h.kind === 'remove' ? 0 : .75, offset: .85 },
      { transform: GT(b), opacity: 0 }], 2400);
    await anim(hand, [
      { transform: HT([a[0] + cpx * .3, a[1] + cpx * .45]), opacity: 0 },
      { transform: HT(a), opacity: 1, offset: .15 }, { transform: HT(a, .85), offset: .25 },
      { transform: HT(b, .85), offset: .72 }, { transform: HT(b), opacity: 1, offset: .85 },
      { transform: HT(b), opacity: 0 }], 2400);
  }

}
setInterval(() => {
  if (!started || busy || drag || press || hintActive) return;
  const now = performance.now();
  const l = pendingLesson();
  if (l && now - lastChange > 700 && now - lastAct > 700) { S.shown.push(S.sec + l.id); showHint(l.act()); lastAct = now; return; }
  const idle = S.sec <= LAY_SEC || S.sec === SPRING_SEC ? 6000 : 10000;   // quicker help in the teaching sections
  if (now - Math.max(lastAct, lastChange) > idle) { lastAct = now; showHint(computeHint()); }
}, 300);

/* ================= boot ================= */
function paintTray() {
  tray.querySelectorAll('.slot').forEach(sl => {
    const keep = [...sl.querySelectorAll('.lock, .count')];
    sl.innerHTML = `<div class="rot">${roadSVG(sl.dataset.piece)}</div>`;
    sl.append(...keep);
    if (sl.dataset.piece === 'b') sl.classList.toggle('locked', !S.bridgeUnlocked);
  });
  paintCount();
}
function paintCount() {
  [['p', true], ['b', S.bridgeUnlocked]].forEach(([type, open]) => {
    const sl = tray.querySelector(`[data-piece="${type}"]`), n = Math.max(0, held(type));
    sl.querySelector('.count').textContent = '×' + n;
    sl.classList.toggle('empty', open && n === 0);
  });
}
function boot(data) {
  S = data && data.tiles ? { ...freshState(), ...data } : freshState();
  if (S.sec > BRIDGE_SEC) S.bridgeUnlocked = true;
  $('#stars').innerHTML = '';
  buildWorld(); paintTray(); paintStars(); layout();
  coinsEl.hidden = S.score === 0; coinN.textContent = S.score;
}
function startGame() {
  Snd.init(); Snd.startMusic(); Snd.tap();
  $('#title').hidden = true; started = true; lastAct = lastChange = performance.now();
}
function restart() {
  $('#end').hidden = true; busy = false; cancelHint();
  boot(null); started = true; lastAct = lastChange = performance.now();
}
function snapshot() {}
window.claude?.hot?.snapshot?.(() => ({ ...S, fails: 0 }));
const startFn = d => boot(d);
window.claude?.hot?.ready ? window.claude.hot.ready(startFn) : startFn(window.claude?.hot?.data ?? {});
</script>
